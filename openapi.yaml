openapi: 3.0.3
info:
  title: SHOPBEE / STORE AI RESTful API Specification
  description: API đặc tả cho Hệ thống Quản lý Bán hàng & Thương mại điện tử tích hợp AI
  version: 2.1.0
servers:
  - url: http://localhost:5000/api
    description: Core Backend API Server
  - url: http://localhost:8000/api
    description: AI Microservices Server
paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản khách hàng mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string, example: customer@example.com }
                password: { type: string, example: Password123@ }
                fullName: { type: string, example: Lê Hoàng Nam }
                phone: { type: string, example: "0912345678" }
      responses:
        201: { description: Đăng ký thành công }
        400: { description: Lỗi dữ liệu đầu vào }

  /auth/login:
    post:
      summary: Đăng nhập hệ thống & cấp phát JWT + Refresh Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: admin@example.com }
                password: { type: string, example: Password123@ }
      responses:
        200: { description: Đăng nhập thành công }
        401: { description: Sai thông tin đăng nhập }

  /auth/refresh-token:
    post:
      summary: Xoay vòng Refresh Token (Token Rotation & Blacklist)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        200: { description: Cấp mới token pair thành công }
        403: { description: Token không hợp lệ }

  /products:
    get:
      summary: Lấy danh sách sản phẩm có phân trang, lọc và tìm kiếm
      parameters:
        - name: category
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: sortBy
          in: query
          schema: { type: string, enum: [price_asc, price_desc, rating_desc, newest] }
      responses:
        200: { description: Danh sách sản phẩm }
    post:
      summary: Thêm sản phẩm mới (Admin/Staff)
      security:
        - BearerAuth: []
      responses:
        201: { description: Thêm sản phẩm thành công }

  /cart:
    get:
      summary: Lấy thông tin giỏ hàng của người dùng hiện tại
      security:
        - BearerAuth: []
      responses:
        200: { description: Chi tiết giỏ hàng }
  /cart/items:
    post:
      summary: Thêm sản phẩm vào giỏ hàng
      security:
        - BearerAuth: []
      responses:
        201: { description: Đã thêm vào giỏ }

  /orders:
    post:
      summary: Tạo đơn đặt hàng mới (Atomic Transaction & Deduct Stock)
      security:
        - BearerAuth: []
      responses:
        201: { description: Đặt hàng thành công }
    get:
      summary: Danh sách tất cả đơn hàng (Admin/Staff)
      security:
        - BearerAuth: []
      responses:
        200: { description: Danh sách đơn hàng }

  /orders/my:
    get:
      summary: Lấy lịch sử đơn hàng của khách hàng đang đăng nhập
      security:
        - BearerAuth: []
      responses:
        200: { description: Lịch sử đơn hàng }

  /ai/recommend:
    post:
      summary: Gợi ý sản phẩm lai (Hybrid Recommendation Engine)
      responses:
        200: { description: Top sản phẩm gợi ý }

  /ai/chat:
    post:
      summary: Trò chuyện RAG AI Chatbot với cơ sở tri thức và Gemini LLM
      responses:
        200: { description: Câu trả lời từ AI kèm Product Cards }

  /ai/forecast:
    post:
      summary: Dự báo doanh thu & nhu cầu chuỗi thời gian (Hybrid-Prophet-ARIMA)
      responses:
        200: { description: Dữ liệu dự báo 30 ngày & metrics }

  /settings:
    get:
      summary: Lấy cấu hình hệ thống (Public: thông tin công khai; Admin: đầy đủ cấu hình)
      responses:
        200: { description: Thông tin cài đặt hệ thống }
    put:
      summary: Cập nhật cấu hình hệ thống (Admin Only)
      security:
        - BearerAuth: []
      responses:
        200: { description: Cập nhật cấu hình thành công }

  /inventory/tickets:
    get:
      summary: Lấy danh sách phiếu nhập/xuất kho (Admin/Manager/Staff)
      security:
        - BearerAuth: []
      responses:
        200: { description: Danh sách phiếu kho }
    post:
      summary: Tạo phiếu yêu cầu nhập/xuất kho (Admin/Manager/Staff)
      security:
        - BearerAuth: []
      responses:
        201: { description: Tạo phiếu kho thành công }

  /payment/create-momo-url:
    post:
      summary: Khởi tạo liên kết thanh toán MoMo Sandbox v2
      security:
        - BearerAuth: []
      responses:
        200: { description: Thông tin thanh toán MoMo (PayUrl, QR, Deeplink) }

  /ai/admin-qa:
    post:
      summary: Trợ lý AI Q&A Báo cáo Bán hàng thông minh (Admin Sales Intelligence Copilot)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question:
                  type: string
                  example: "Tháng này mặt hàng nào bán chậm nhất và còn tồn kho nhiều?"
      responses:
        200:
          description: Phân tích số liệu thực tế CSDL kèm khuyến nghị kinh doanh

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
